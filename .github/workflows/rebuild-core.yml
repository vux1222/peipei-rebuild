name: rebuild-core

on:
  push:
    branches: [rebuild-scaffold]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile reconstructed core
        run: |
          python -m py_compile \
            rebuild_src/bilisub/config.py \
            rebuild_src/bilisub/models.py \
            rebuild_src/bilisub/ffmpeg_utils.py \
            rebuild_src/bilisub/srt.py \
            rebuild_src/bilisub/pipeline.py
      - name: Run core tests
        run: python -m unittest -v tests/test_rebuild_core.py
