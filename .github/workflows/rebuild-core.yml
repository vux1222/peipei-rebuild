name: rebuild-core

on:
  push:
    branches: [rebuild-scaffold, vuxgm-1.0.0-restore]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile reconstructed source
        run: |
          python -m py_compile \
            rebuild_src/peipei_launch.py \
            rebuild_src/bilisub/config.py \
            rebuild_src/bilisub/vuxgm_config.py \
            rebuild_src/bilisub/license_client.py \
            rebuild_src/bilisub/license_bootstrap.py \
            rebuild_src/bilisub/vuxgm_license.py \
            rebuild_src/bilisub/credit.py \
            rebuild_src/bilisub/giahan.py \
            rebuild_src/bilisub/legacy_bridge.py \
            rebuild_src/bilisub/models.py \
            rebuild_src/bilisub/ffmpeg_utils.py \
            rebuild_src/bilisub/srt.py \
            rebuild_src/bilisub/asr.py \
            rebuild_src/bilisub/pipeline.py \
            rebuild_src/bilisub/gui/license_dialog.py \
            rebuild_src/bilisub/gui/legacy_licensed_main.py \
            rebuild_src/bilisub/gui/main_window.py
      - name: Run core tests
        run: python -m unittest -v tests/test_rebuild_core.py
